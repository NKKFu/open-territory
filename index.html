<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a8dbe2">
  <title>Open Territory — Baía do Sol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="world" aria-label="Open Territory: mundo 3D de Baía do Sol"></main>
  <div id="dialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="speaker">
    <section class="dialog-card">
      <p id="speaker" class="eyebrow"></p>
      <p id="speech"></p>
      <button id="closeDialog" type="button">Continuar explorando ↗</button>
    </section>
  </div>
  <div id="touch" class="hidden" aria-label="Controles de toque">
    <div class="dpad"><button data-key="w" aria-label="Andar para frente">▲</button><button data-key="a" aria-label="Andar para a esquerda">◀</button><button data-key="s" aria-label="Andar para trás">▼</button><button data-key="d" aria-label="Andar para a direita">▶</button></div>
    <div class="touch-actions"><button id="touchJump" aria-label="Pular ou frear">↑</button><button id="touchE" aria-label="Interagir">E</button></div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
